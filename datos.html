    <script>
        // document.getElementById('current-year').textContent = new Date().getFullYear(); // Eliminado: se maneja en load-components.js
        // function toggleMobileMenu() ... // Eliminado: se maneja en load-components.js

        // --- CONSTANTS ---
        const NETLIFY_FUNCTION_ENDPOINT = '/.netlify/functions/create-preference';
        const SHIPPING_RATES = {
            'montevideo': 270,
            'interior': 300,
            'pickup': 0
        };

        // --- DISCOUNT STATE ---
        let appliedDiscountCode = localStorage.getItem('appliedDiscountCode') || null;
        let appliedDiscountPercent = parseFloat(localStorage.getItem('appliedDiscountPercent')) || 0;

        async function applyDiscountCode() {
            const input = document.getElementById('discount-code-input');
            const btn = document.getElementById('apply-discount-btn');
            const msg = document.getElementById('discount-message');
            
            if (!input || !btn || !msg) return;

            const code = input.value.trim();
            if (!code) {
                alert("Por favor ingresá un código de descuento.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Verificando...";
            msg.classList.add('hidden');

            try {
                // Detectar entorno local
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
                
                let data;
                if (isLocal) {
                    // Simulación local de cupones
                    await new Promise(resolve => setTimeout(resolve, 800));
                    if (code.toUpperCase().startsWith('MOCK') || code.toUpperCase() === 'TEST10') {
                        data = { valid: true, code: code.toUpperCase(), discount_percent: 10 };
                    } else {
                        data = { valid: false, error: "El cupón no existe en modo local. Prueba con 'MOCK10' o 'TEST10'." };
                    }
                } else {
                    const response = await fetch('/.netlify/functions/validate-discount', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });
                    data = await response.json();
                }

                if (data.valid) {
                    appliedDiscountCode = data.code;
                    appliedDiscountPercent = data.discount_percent;
                    localStorage.setItem('appliedDiscountCode', appliedDiscountCode);
                    localStorage.setItem('appliedDiscountPercent', appliedDiscountPercent);

                    msg.textContent = `¡Cupón aplicado! Descuento del ${appliedDiscountPercent}%`;
                    msg.className = "text-xs mt-1 text-green-600 font-semibold block";
                    
                    input.disabled = true;
                    btn.disabled = false;
                    btn.textContent = "Quitar";
                    btn.onclick = removeDiscountCode;
                    
                    updateCheckoutDisplay();
                } else {
                    msg.textContent = data.error || "Cupón inválido o expirado.";
                    msg.className = "text-xs mt-1 text-red-500 font-semibold block";
                    btn.disabled = false;
                    btn.textContent = "Aplicar";
                }
            } catch (err) {
                console.error("Error al validar cupón:", err);
                msg.textContent = "Error al validar el cupón. Inténtalo de nuevo.";
                msg.className = "text-xs mt-1 text-red-500 font-semibold block";
                btn.disabled = false;
                btn.textContent = "Aplicar";
            }
        }

        function removeDiscountCode() {
            const input = document.getElementById('discount-code-input');
            const btn = document.getElementById('apply-discount-btn');
            const msg = document.getElementById('discount-message');

            appliedDiscountCode = null;
            appliedDiscountPercent = 0;
            localStorage.removeItem('appliedDiscountCode');
            localStorage.removeItem('appliedDiscountPercent');

            if (input) {
                input.value = "";
                input.disabled = false;
            }
            if (btn) {
                btn.textContent = "Aplicar";
                btn.onclick = applyDiscountCode;
            }
            if (msg) {
                msg.classList.add('hidden');
            }

            updateCheckoutDisplay();
        }

        // --- HELPERS ---
        function getCheckoutCart() {
            // Simplificado para igualar exactamente a carrito.html
            const raw = localStorage.getItem('cartItems');
            return raw ? JSON.parse(raw) : [];
        }



        // --- CORE LOGIC ---

        /**
         * Muestra/Oculta campos de dirección Y actualiza precios
         */
        function toggleDeliveryFields() {
            const deliverySelect = document.getElementById('delivery-option');
            const selectedOption = deliverySelect.value;
            const deliveryDetailsContainer = document.getElementById('delivery-details-container');
            const buyerAddressText = document.getElementById('buyer-address-text');
            const buyerDepartmentSelect = document.getElementById('buyer-department-select');
            const buyerDistrictSelect = document.getElementById('buyer-district-select');
            const buyerLocalidadText = document.getElementById('buyer-localidad-text');
            const locationLabel = document.getElementById('location-label');

            const montevideoWrapper = document.getElementById('montevideo-select-wrapper');
            const interiorWrapper = document.getElementById('interior-select-wrapper');

            // Reset básico: Limpiar visibilidad Y atributos required de TODOS los campos condicionales
            deliveryDetailsContainer.classList.add('hidden');
            if (montevideoWrapper) montevideoWrapper.classList.add('hidden');
            if (interiorWrapper) interiorWrapper.classList.add('hidden');

            buyerAddressText.removeAttribute('required');
            if (buyerDistrictSelect) buyerDistrictSelect.removeAttribute('required');
            if (buyerDepartmentSelect) buyerDepartmentSelect.removeAttribute('required');
            if (buyerLocalidadText) buyerLocalidadText.removeAttribute('required');

            if (selectedOption === 'montevideo' || selectedOption === 'interior') {
                deliveryDetailsContainer.classList.remove('hidden');
                buyerAddressText.setAttribute('required', 'required');

                if (selectedOption === 'montevideo') {
                    locationLabel.textContent = 'Barrio de Montevideo *';
                    if (montevideoWrapper) montevideoWrapper.classList.remove('hidden');
                    // Solo activamos lo necesario
                    if (buyerDistrictSelect) buyerDistrictSelect.setAttribute('required', 'required');

                } else if (selectedOption === 'interior') {
                    locationLabel.textContent = 'Departamento y Localidad *';
                    if (interiorWrapper) interiorWrapper.classList.remove('hidden');
                    // Solo activamos lo necesario
                    if (buyerDepartmentSelect) buyerDepartmentSelect.setAttribute('required', 'required');
                    if (buyerLocalidadText) buyerLocalidadText.setAttribute('required', 'required');
                }
            }
            updateCheckoutDisplay();
        }

        /**
         * Rellena el resumen lateral
         */
        function updateCheckoutDisplay() {
            const summaryContainer = document.getElementById('checkout-items-summary');
            const subtotalEl = document.getElementById('checkout-subtotal');
            const shippingEl = document.getElementById('checkout-shipping');
            const totalEl = document.getElementById('checkout-total');
            const deliverySelect = document.getElementById('delivery-option');

            if (!summaryContainer) {
                console.error("DEBUG: Contenedor no encontrado");
                return;
            }

            const cartItems = getCheckoutCart();
            let subtotal = 0; // Inicializamos subtotal

            // 1. Renderizar Items y Calcular Suma al vuelo
            summaryContainer.innerHTML = '';

            cartItems.forEach(item => {
                // Forzar conversión numérica para asegurar matemáticas correctas
                const price = parseFloat(item.price) || 0;
                const quantity = parseInt(item.quantity) || 0;

                const itemTotal = price * quantity;
                subtotal += itemTotal; // Sumamos al acumulador

                const itemHTML = `
            <div class="flex justify-between items-center text-xs text-text-dark">
                <div class="flex items-center gap-2">
                    <div class="bg-gray-100 p-1 rounded border border-gray-200">
                        <img src="${item.imageUrl}" class="w-8 h-8 object-cover" alt="img" onerror="this.src='images/logo.png'">
                    </div>
                    <span>${quantity} x ${item.name}</span>
                </div>
                <span class="font-semibold">$${itemTotal.toFixed(2)}</span>
            </div>`;
                summaryContainer.insertAdjacentHTML('beforeend', itemHTML);
            });

            // 2. Calcular Envío
            let shippingCost = 0;
            let shippingText = 'A calcular';
            const selectedOption = deliverySelect ? deliverySelect.value : '';

            if (selectedOption && SHIPPING_RATES[selectedOption] !== undefined) {
                shippingCost = SHIPPING_RATES[selectedOption];
                shippingText = shippingCost === 0 ? 'Gratis' : `$${shippingCost.toFixed(2)}`;
                shippingEl.classList.remove('text-rp-teal', 'text-sm');
                shippingEl.classList.add('font-bold');
            } else {
                shippingEl.classList.add('text-rp-teal', 'text-sm');
                shippingEl.classList.remove('font-bold');
            }

            // 2b. Calcular Descuento
            let discountAmount = 0;
            const discountRow = document.getElementById('discount-row');
            const discountEl = document.getElementById('checkout-discount');
            const discountPercentVal = document.getElementById('discount-percent-val');

            if (appliedDiscountPercent > 0) {
                discountAmount = subtotal * (appliedDiscountPercent / 100);
                if (discountEl) discountEl.textContent = `-$${discountAmount.toFixed(2)}`;
                if (discountPercentVal) discountPercentVal.textContent = appliedDiscountPercent;
                if (discountRow) discountRow.classList.remove('hidden');
            } else {
                if (discountRow) discountRow.classList.add('hidden');
            }

            // 3. Calcular Total
            const total = subtotal - discountAmount + shippingCost;

            // 4. Actualizar DOM
            subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
            shippingEl.textContent = shippingText;
            if (totalEl) totalEl.textContent = `$${total.toFixed(2)}`;
        }

        /**
         * Wrapper para enviar el formulario con feedback visual
         */
        function submitCheckoutForm() {
            const form = document.getElementById('checkout-form');
            if (form.checkValidity()) {
                processCheckoutPage();
            } else {
                // Forzar muestreo de errores nativos
                form.reportValidity();
                // Alerta explicita por si el usuario no ve el bubble
                alert("Por favor, completa todos los campos obligatorios antes de continuar.");
            }
        }

        /**
         * Procesa datos y llama a backend
         */
        function processCheckoutPage() {
            // Recopilación de datos
            const nameEl = document.getElementById('buyer-name');
            const emailEl = document.getElementById('buyer-email');
            const deliverySelect = document.getElementById('delivery-option');
            const addressEl = document.getElementById('buyer-address-text');

            if (!nameEl || !emailEl || !deliverySelect) {
                alert("Error interno: Faltan campos del formulario.");
                return;
            }

            const name = nameEl.value;
            const email = emailEl.value;
            const deliveryOption = deliverySelect.value;
            const address = addressEl ? addressEl.value : 'Retiro en local';

            let district = '';
            try {
                if (deliveryOption === 'montevideo') {
                    const distSelect = document.getElementById('buyer-district-select');
                    district = `Montevideo - ${distSelect.value}`;
                } else if (deliveryOption === 'interior') {
                    const deptSelect = document.getElementById('buyer-department-select');
                    const locText = document.getElementById('buyer-localidad-text');
                    district = `${deptSelect.value} - ${locText.value}`;
                } else {
                    district = 'Pick Up / Retiro en Tienda';
                }
            } catch (e) {
                console.error("Error al obtener ubicación:", e);
                // Fallback para evitar bloqueo
                district = "Ubicación no especificada";
            }

            const cartItems = getCheckoutCart();
            if (cartItems.length === 0) {
                alert("Tu carrito está vacío. Agregá productos antes de finalizar la compra.");
                window.location.href = 'carrito';
                return;
            }

            checkoutCartMP(name, email, deliveryOption, district, address, cartItems);
        }

        /**
         * Backend Call
         */
        async function checkoutCartMP(buyerName, buyerEmail, deliveryOption, district, address, cartItems) {
            const btn = document.querySelector('button[onclick*="submitCheckoutForm"]');
            const originalText = btn ? btn.innerHTML : "FINALIZAR COMPRA";

            // Detectar entorno local
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = `
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Procesando...`;
                }

                const itemsForMP = cartItems.map(item => ({
                    title: item.name,
                    unit_price: parseFloat(item.price),
                    quantity: parseInt(item.quantity)
                }));

                // GA4 Event
                const cartTotal = cartItems.reduce((total, item) => total + (item.price * item.quantity), 0);
                if (window.dataLayer) {
                    window.dataLayer.push({
                        event: 'begin_checkout',
                        ecommerce: {
                            currency: 'UYU',
                            value: cartTotal,
                            items: cartItems.map(item => ({
                                item_name: item.name,
                                item_id: item.name.toLowerCase().replace(/\s+/g, '_'),
                                price: item.price,
                                quantity: item.quantity
                            }))
                        }
                    });
                }

                let data;
                if (isLocal) {
                    // MOCK RESPONSE FOR LOCAL TESTING
                    console.warn("Modo Local Detectado: Simulando llamada al backend...");
                    await new Promise(resolve => setTimeout(resolve, 2000)); // Fake delay
                    data = { preferenceId: "MOCK_PREFERENCE_ID_FOR_TESTING" };
                    alert("¡Estás en entorno local!\n\nEl sistema ha simulado una respuesta exitosa del servidor.\nEn producción, esto te redirigiría a Mercado Pago.");
                } else {
                    // REAL BACKEND CALL
                    const response = await fetch(NETLIFY_FUNCTION_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            items: itemsForMP,
                            buyerName: buyerName,
                            buyerEmail: buyerEmail,
                            deliveryOption: deliveryOption,
                            district: district,
                            address: address,
                            discountCode: appliedDiscountCode
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || `Error servidor: ${response.status}`);
                    }
                    data = await response.json();
                }

                if (data.preferenceId) {
                    if (isLocal) {
                        // En local no redirigimos a MP real para no romper la url
                        console.log("Mock Redirect to: ", `https://www.mercadopago.com.uy/checkout/v1/redirect?pref_id=${data.preferenceId}`);
                        // Restauramos botón
                        if (btn) {
                            btn.disabled = false;
                            btn.textContent = "FINALIZAR COMPRA (Simulación Exitosa)";
                        }
                    } else {
                        const redirectUrl = `https://www.mercadopago.com.uy/checkout/v1/redirect?pref_id=${data.preferenceId}`;
                        window.location.href = redirectUrl;
                    }
                } else {
                    throw new Error("Respuesta inválida del servidor (Falta Preference ID)");
                }

            } catch (error) {
                console.error("Fallo al obtener Preferencia de MP:", error);

                let msg = `No se pudo iniciar el pago. \nDetalle: ${error.message}`;
                if (error.message.includes("Failed to fetch")) {
                    msg += "\n\nNOTA: Si estás probando localmente, esto es normal porque la función de backend no es accesible sin conexión a internet o servidor de desarrollo activo.";
                }
                alert(msg);

                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }
        }

        // --- ABANDONED CART TRACKING ---
        async function trackAbandonedCart() {
            const nameEl = document.getElementById('buyer-name');
            const emailEl = document.getElementById('buyer-email');
            if (!nameEl || !emailEl) return;

            const customer_name = nameEl.value.trim();
            const customer_email = emailEl.value.trim();

            // Solo trackear si ambos campos tienen contenido y el email es mínimamente válido
            if (!customer_name || !customer_email || !customer_email.includes('@')) return;

            const cartItems = getCheckoutCart();
            if (cartItems.length === 0) return;

            const total = cartItems.reduce((sum, item) => sum + (parseFloat(item.price) * parseInt(item.quantity)), 0);

            // Formatear items para la DB
            const items = cartItems.map(item => ({
                id: item.name.toLowerCase().replace(/\s+/g, '-'),
                name: item.name,
                price: parseFloat(item.price),
                quantity: parseInt(item.quantity)
            }));

            // Determinar entorno local para simulación
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';

            try {
                if (isLocal) {
                    console.log("📝 [MOCK-TRACK-CART] Carrito abandonado trackeado (Simulado):", {
                        customer_name,
                        customer_email,
                        items,
                        total
                    });
                    
                    // En local guardamos también en localStorage simulando la DB local
                    let localMockCarts = [];
                    try {
                        const stored = localStorage.getItem('localMockCarts');
                        if (stored) localMockCarts = JSON.parse(stored);
                    } catch (e) {
                        console.error(e);
                    }
                    
                    // Upsert por email en estado pending
                    const existingIdx = localMockCarts.findIndex(c => c.customer_email.toLowerCase() === customer_email.toLowerCase() && c.status === 'pending');
                    if (existingIdx > -1) {
                        localMockCarts[existingIdx].customer_name = customer_name;
                        localMockCarts[existingIdx].items = items;
                        localMockCarts[existingIdx].total = total;
                        localMockCarts[existingIdx].created_at = new Date().toISOString();
                    } else {
                        localMockCarts.push({
                            id: `MOCK-CART-${Date.now()}`,
                            customer_name,
                            customer_email,
                            items,
                            total,
                            status: 'pending',
                            created_at: new Date().toISOString()
                        });
                    }
                    localStorage.setItem('localMockCarts', JSON.stringify(localMockCarts));
                } else {
                    const response = await fetch('/.netlify/functions/track-cart', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            customer_name,
                            customer_email,
                            items,
                            total
                        })
                    });
                    const resData = await response.json();
                    console.log("📝 [TRACK-CART] Respuesta del servidor:", resData);
                }
            } catch (err) {
                console.error("Error al trackear carrito abandonado:", err);
            }
        }

        // Agregar listeners de tracking y precargar/guardar datos de localStorage
        document.addEventListener('DOMContentLoaded', () => {
            const nameEl = document.getElementById('buyer-name');
            const emailEl = document.getElementById('buyer-email');
            
            // Precargar datos desde localStorage si existen
            if (nameEl) {
                const savedName = localStorage.getItem('customer_name');
                if (savedName) nameEl.value = savedName;
                
                // Guardar en localStorage cuando se modifique el campo
                nameEl.addEventListener('input', () => {
                    localStorage.setItem('customer_name', nameEl.value.trim());
                });
            }
            
            if (emailEl) {
                const savedEmail = localStorage.getItem('customer_email');
                if (savedEmail) emailEl.value = savedEmail;
                
                // Guardar en localStorage cuando se modifique el campo
                emailEl.addEventListener('input', () => {
                    localStorage.setItem('customer_email', emailEl.value.trim().toLowerCase());
                });
            }

            if (nameEl && emailEl) {
                nameEl.addEventListener('blur', trackAbandonedCart);
                emailEl.addEventListener('blur', trackAbandonedCart);
            }

            // Inicializar estado del cupón precargado si existe
            const discountInput = document.getElementById('discount-code-input');
            const discountBtn = document.getElementById('apply-discount-btn');
            const discountMsg = document.getElementById('discount-message');
            if (appliedDiscountCode && discountInput && discountBtn && discountMsg) {
                discountInput.value = appliedDiscountCode;
                discountInput.disabled = true;
                discountBtn.textContent = "Quitar";
                discountBtn.onclick = removeDiscountCode;
                discountMsg.textContent = `¡Cupón aplicado! Descuento del ${appliedDiscountPercent}%`;
                discountMsg.className = "text-xs mt-1 text-green-600 font-semibold block";
            }
        });

        // Initialize
        updateCartCount();
        updateCheckoutDisplay(); // Fill summary on load

        // Initial GA4 page_view
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: 'page_view', page_title: 'Checkout - Circula', page_location: window.location.href });
    </script>
