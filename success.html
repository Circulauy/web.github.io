<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Aprobado! - Circula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Patua+One&display=swap" rel="stylesheet">
    <script>
        // Configuración de Tailwind (Asegúrate de copiar tu config completa aquí si la tienes externa)
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-light': '#fafafa', 'text-dark': '#333333', 'rp-teal': '#79C7C7', 
                        'rp-mint': '#A3E6BA', 'rp-blue-light': '#e0f7f7', 'rp-gray-soft': '#dddddd', 
                        'rp-border-default': '#b5b5b5', 'mp-blue': '#009ee3', 
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'], heading: ['Patua One', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        .title-style { font-family: 'Patua One', cursive; font-weight: 700; }
    </style>
</head>
<body class="font-sans bg-bg-light text-text-dark min-h-screen flex flex-col">
    
    <header class="shadow-md bg-white">
        <div class="container mx-auto px-4 py-4">
            <a href="index.html#home" class="flex items-center text-text-dark">
                <img src="images/logo.png" alt="Logo Circula" class="h-10 object-contain">
            </a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-xl shadow-2xl max-w-xl text-center border-t-4 border-rp-mint">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-rp-mint mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h1 class="text-3xl font-bold text-text-dark mb-2 title-style">¡PAGO APROBADO!</h1>
            <p class="text-lg text-gray-600 mb-6">Gracias por tu compra. Recibirás una confirmación por correo electrónico en breve.</p>
            <a href="index.html#tienda" class="py-2 px-6 bg-rp-teal text-white font-semibold rounded-lg hover:bg-rp-teal/90 transition">Volver a la Tienda</a>
        </div>
    </main>

    <footer class="bg-text-dark text-white py-4 text-center">
        <p class="text-sm text-gray-500">&copy; Circula. Economía Circular.</p>
    </footer>

    <script>
        // Si usas localStorage, aquí vaciarías el carrito:
        // localStorage.removeItem('cartItems'); 
    </script>
</body>
</html>
