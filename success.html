<body class="font-sans bg-bg-light text-text-dark min-h-screen flex flex-col">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TH8WM8KW" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-200/50">
    </header>

    <main class="flex-grow flex items-center justify-center p-6 pt-32 pb-20">
        <div class="bg-white p-10 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] max-w-xl text-center border-t-4 border-rp-teal">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-rp-mint mx-auto mb-4" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h1 class="text-3xl font-bold text-text-dark mb-2 title-style">¡PAGO APROBADO!</h1>
            <p class="text-lg text-gray-600 mb-4">Gracias por tu compra. Recibirás una confirmación por correo
                electrónico en breve.</p>

            <!-- Contenedor Ficha de Impacto -->
            <div id="impact-container"
                class="hidden my-6 p-5 bg-rp-blue-light/50 border border-rp-teal/30 rounded-lg text-center">
                <h3 class="text-sm font-bold uppercase tracking-wider text-text-dark/80 mb-2">🌿 Tu Huella Positiva</h3>
                <p class="text-sm text-gray-600 mb-4">Descargá la ficha oficial con el impacto ambiental de los
                    productos que acabás de adquirir.</p>
                <a id="download-impact-btn" href="#" target="_blank"
                    class="inline-flex items-center justify-center gap-2 py-2.5 px-6 bg-rp-teal text-white font-bold rounded-lg hover:bg-rp-teal/90 transition text-sm shadow-md w-full sm:w-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"
                        style="width:1rem;height:1rem;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    DESCARGAR FICHA DE IMPACTO (PDF)
                </a>
            </div>

            <div class="mt-6">
                <a href="index#tienda"
                    class="inline-block py-2.5 px-6 bg-text-dark text-white font-semibold rounded-lg hover:bg-text-dark/95 transition">Volver
                    a la Tienda</a>
            </div>
        </div>
    </main>

    <footer class="bg-text-dark text-white py-12 border-t border-gray-800">
    </footer>

    <script src="js/load-components.js?v=1.0.1"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 1. Get transaction ID from URL (Mercado Pago params)
            const urlParams = new URLSearchParams(window.location.search);
            const transactionId = urlParams.get('payment_id') || urlParams.get('collection_id') || `ORDER-${Date.now()}`;

            // 2. Retrieve Cart Items from LocalStorage
            let cartItems = [];
            let isNewPurchase = false;
            try {
                const storedCart = localStorage.getItem('cartItems');
                if (storedCart) {
                    cartItems = JSON.parse(storedCart);
                    isNewPurchase = true;
                }
            } catch (e) {
                console.error("Error reading cart from storage:", e);
            }

            // Si el carrito está vacío, intentar recuperar la última compra (para refrescos de página)
            if (cartItems.length === 0) {
                try {
                    const lastCart = localStorage.getItem('lastOrderItems');
                    if (lastCart) {
                        cartItems = JSON.parse(lastCart);
                    }
                } catch (e) {
                    console.error("Error al leer última compra:", e);
                }
            }

            // 3. Fire GA4 Purchase Event (ONLY if it's a new purchase)
            if (cartItems.length > 0) {
                if (isNewPurchase) {
                    // Calculate Total
                    const value = cartItems.reduce((acc, item) => acc + (item.price * item.quantity), 0);

                    window.dataLayer = window.dataLayer || [];
                    window.dataLayer.push({
                        event: 'purchase',
                        ecommerce: {
                            transaction_id: transactionId,
                            value: value,
                            currency: 'UYU',
                            items: cartItems.map(item => ({
                                item_name: item.name,
                                item_id: item.name.toLowerCase().replace(/\s+/g, '_'),
                                price: item.price,
                                quantity: item.quantity
                            }))
                        }
                    });
                    console.log("GA4 Purchase Event Sent:", transactionId, value);
                }

                // --- CONFIGURACIÓN DE FICHA DE IMPACTO ---
                const customerName = localStorage.getItem('customer_name') || 'Cliente';
                const customerEmail = localStorage.getItem('customer_email') || 'cliente@circula.uy';

                const itemsParam = encodeURIComponent(JSON.stringify(cartItems.map(item => ({
                    id: item.id || item.name.toLowerCase().replace(/\s+/g, '-'),
                    name: item.name,
                    qty: item.quantity
                }))));

                const impactBtn = document.getElementById('download-impact-btn');
                const impactContainer = document.getElementById('impact-container');
                if (impactBtn && impactContainer) {
                    impactBtn.href = `https://crea.circula.uy/ficha?items=${itemsParam}&client_name=${encodeURIComponent(customerName)}&client_email=${encodeURIComponent(customerEmail)}`;
                    impactContainer.classList.remove('hidden');
                }

                // 4. Guardar como última compra y borrar el carrito activo
                if (isNewPurchase) {
                    localStorage.setItem('lastOrderItems', JSON.stringify(cartItems));
                    localStorage.removeItem('cartItems');
                }
            } else {
                console.warn("No items found for purchase.");
            }
        });
    </script>
</body>

</html>
