    <script src="https://cdn.tailwindcss.com"></script>

    <script>tailwind.config = { theme: { extend: { colors: { 'bg-light': '#fafafa', 'text-dark': '#333333', 'rp-teal': '#79C7C7', 'rp-mint': '#A3E6BA', 'rp-blue-light': '#e0f7f7', 'rp-gray-soft': '#dddddd', 'rp-border-default': '#b5b5b5', 'mp-blue': '#009ee3' }, fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Patua One', 'cursive'], brand: ['Montserrat', 'sans-serif'] } } } }</script>
    <style>
        html {
            scroll-behavior: smooth;
            scrollbar-width: none
        }

        html::-webkit-scrollbar {
            display: none
        }

        .section-padding {
            padding-top: 6rem;
            padding-bottom: 6rem
        }

        .title-style {
            font-family: 'Patua One', cursive;
            font-weight: 700;
            letter-spacing: -0.01em
        }

        .nav-link {
            position: relative
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: #79C7C7;
            transition: width .3s ease
        }

        .nav-link:hover::after {
            width: 100%
        }

        #cart-header-row {
            display: none;
            background-color: #f3f4f6;
            border-bottom: 1px solid #d1d5db;
            padding: .75rem 1.5rem;
            font-weight: 700;
            font-size: .875rem;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .cart-item-row {
            display: flex;
            flex-direction: column;
            padding: 1rem 1.5rem;
            gap: .5rem
        }

        .cart-item-row:hover {
            background-color: #f9f9f9
        }

        .cart-item-product {
            display: flex;
            align-items: center;
            gap: .75rem;
            width: 100%
        }

        .cart-item-mobile-data {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            padding-left: 68px;
            padding-top: .5rem
        }

        .cart-item-mobile-data>div {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .875rem
        }

        .cart-item-mobile-data .label {
            color: #6B7280;
            font-weight: 500
        }

        .cart-item-mobile-data .value {
            font-weight: 700;
            color: #333
        }

        .cart-item-mobile-data .qty-box {
            background-color: #f3f4f6;
            font-weight: 700;
            padding: .25rem .75rem;
            border-radius: .25rem;
            border: 1px solid #e5e7eb
        }

        .cart-item-desktop-price,
        .cart-item-desktop-qty,
        .cart-item-desktop-total {
            display: none
        }

        @media(min-width:640px) {
            #cart-header-row {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 1rem;
                align-items: center
            }

            #cart-header-row>div:nth-child(1) {
                grid-column: span 2/span 2;
                text-align: left
            }

            #cart-header-row>div:nth-child(2) {
                text-align: center
            }

            #cart-header-row>div:nth-child(3) {
                text-align: center
            }

            #cart-header-row>div:nth-child(4) {
                text-align: right
            }

            .cart-item-row {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 1rem;
                align-items: center
            }

            .cart-item-product {
                grid-column: span 2/span 2
            }

            .cart-item-mobile-data {
                display: none
            }

            .cart-item-desktop-price,
            .cart-item-desktop-qty,
            .cart-item-desktop-total {
                display: block
            }

            .cart-item-desktop-price {
                text-align: center;
                color: #4B5563;
                font-weight: 500
            }

            .cart-item-desktop-qty {
                display: flex;
                justify-content: center
            }

            .cart-item-desktop-qty-box {
                background-color: #f3f4f6;
                font-weight: 700;
                padding: .25rem .75rem;
                border-radius: .25rem;
                border: 1px solid #e5e7eb
            }

            .cart-item-desktop-total {
                text-align: right;
                font-weight: 700;
                font-size: 1.125rem;
                color: #79C7C7
            }
        }
    </style>
</head>

<body class="font-sans bg-bg-light text-text-dark">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TH8WM8KW" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>

    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200/50">
        <!-- Header content loaded via js/load-components.js -->
    </header>

    <main>
        <section class="bg-bg-light section-padding pt-32 pb-20">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div
                    class="flex justify-between items-center text-center mb-10 border-b border-rp-gray-soft pb-6 overflow-x-auto">
                    <div class="flex flex-col items-center min-w-[80px]">
                        <span
                            class="w-10 h-10 rounded-full bg-rp-teal text-white flex items-center justify-center font-bold text-lg shadow-md mb-2">1</span>
                        <span class="font-bold text-text-dark text-xs md:text-sm">CARRITO</span>
                    </div>
                    <div class="flex-1 h-1 bg-rp-teal/50 mx-2 rounded"></div>
                    <div class="flex flex-col items-center min-w-[80px] opacity-60">
                        <span
                            class="w-10 h-10 rounded-full border-2 border-gray-300 text-gray-500 flex items-center justify-center font-bold text-lg mb-2">2</span>
                        <span class="font-bold text-gray-500 text-xs md:text-sm">DATOS</span>
                    </div>
                    <div class="flex-1 h-1 bg-gray-200 mx-2 rounded"></div>
                    <div class="flex flex-col items-center min-w-[80px] opacity-60">
                        <span
                            class="w-10 h-10 rounded-full border-2 border-gray-300 text-gray-500 flex items-center justify-center font-bold text-lg mb-2">3</span>
                        <span class="font-bold text-gray-500 text-xs md:text-sm">ESTADO</span>
                    </div>
                </div>

                <div class="flex flex-col lg:flex-row gap-8 items-start">
                    <div class="w-full lg:w-3/5">
                        <div class="bg-white rounded-xl shadow-lg border border-rp-gray-soft overflow-hidden">
                            <div id="cart-header-row">
                                <div class="sm:col-span-2 text-left pl-2">PRODUCTO</div>
                                <div class="text-center">PRECIO</div>
                                <div class="text-center">CANT.</div>
                                <div class="text-right pr-2">TOTAL</div>
                            </div>
                            <div id="cart-items-list-page" class="divide-y divide-rp-gray-soft min-h-[100px] bg-white">
                            </div>
                            <div class="p-6 bg-gray-50 border-t border-rp-gray-soft">
                                <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <input type="text" placeholder="Código de descuento"
                                        class="w-full sm:w-1/2 px-4 py-3 border border-rp-border-default rounded-lg outline-none bg-white focus:ring-2 focus:ring-rp-teal transition">
                                    <div class="flex gap-4 w-full sm:w-auto justify-end">
                                        <button
                                            class="bg-text-dark text-white font-bold py-3 px-6 rounded-lg hover:bg-text-dark/80 transition shadow text-sm">APLICAR</button>
                                        <button id="clear-cart-button" onclick="clearCart()"
                                            class="text-red-500 font-bold hover:text-red-700 text-sm transition py-3">VACIAR</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="w-full lg:w-2/5 sticky top-24">
                        <div class="bg-white p-6 md:p-8 rounded-xl shadow-xl border-t-4 border-rp-teal">
                            <h2 class="text-2xl font-bold mb-6 text-text-dark title-style border-b pb-4">RESUMEN</h2>
                            <div class="space-y-4 mb-6 text-text-dark/80">
                                <div class="flex justify-between items-center">
                                    <span>Subtotal</span>
                                    <span id="cart-subtotal-page" class="font-bold text-lg">$0.00</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span>Envío</span>
                                    <span
                                        class="text-rp-teal text-sm font-semibold cursor-pointer hover:underline">Calculado
                                        al final</span>
                                </div>
                            </div>
                            <div
                                class="flex justify-between items-center font-bold text-2xl mb-8 border-t border-rp-gray-soft pt-6">
                                <span class="text-text-dark">TOTAL</span>
                                <span id="cart-total-page" class="text-mp-blue">$0.00</span>
                            </div>
                            <button onclick="window.location.href='datos.html'"
                                class="w-full bg-mp-blue text-white font-bold py-4 px-6 rounded-lg hover:bg-mp-blue/90 transition mb-4 shadow-lg text-lg tracking-wide hover:-translate-y-1">
                                FINALIZAR COMPRA
                            </button>
                            <button onclick="window.location.href='tienda.html'"
                                class="w-full bg-transparent border-2 border-gray-300 text-gray-500 font-bold py-3 px-6 rounded-lg hover:border-rp-teal hover:text-rp-teal transition text-center">
                                Seguir Comprando
                            </button>
                        </div>
                        <div class="mt-6 text-center opacity-60">
                            <p class="text-xs text-gray-400 flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                                Pago 100% seguro con Mercado Pago
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-text-dark text-white py-12 border-t border-gray-800">
        <!-- Footer content loaded via js/load-components.js -->
    </footer>

    <script src="js/load-components.js"></script>
    <script>
        // Removed redundant updateCartCount and Year logic as they are now in load-components.js


        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
            const container = document.getElementById('cart-items-list-page');
            if (cart.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-gray-500"><p class="text-lg">Tu carrito está vacío</p><a href="tienda.html" class="inline-block mt-4 text-rp-teal hover:underline">Ir a la tienda</a></div>';
                updateTotals(0);
                return;
            }
            container.innerHTML = '';
            cart.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'cart-item-row';
                row.innerHTML = `
                    <div class="cart-item-product">
                        <img src="${item.imageUrl}" alt="${item.name}" class="w-14 h-14 object-cover rounded border border-rp-gray-soft">
                        <div>
                            <h4 class="font-bold text-text-dark">${item.name}</h4>
                            <button onclick="removeItem(${index})" class="text-red-500 text-xs hover:underline mt-1">Eliminar</button>
                        </div>
                    </div>
                    <div class="cart-item-mobile-data">
                        <div><span class="label">Precio:</span><span class="value">$${item.price}</span></div>
                        <div><span class="label">Cantidad:</span><span class="qty-box">${item.quantity}</span></div>
                        <div><span class="label">Total:</span><span class="value text-rp-teal">$${(item.price * item.quantity).toFixed(2)}</span></div>
                    </div>
                    <div class="cart-item-desktop-price">$${item.price}</div>
                    <div class="cart-item-desktop-qty"><span class="cart-item-desktop-qty-box">${item.quantity}</span></div>
                    <div class="cart-item-desktop-total">$${(item.price * item.quantity).toFixed(2)}</div>
                `;
                container.appendChild(row);
            });
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            updateTotals(total);
        }

        function updateTotals(total) {
            document.getElementById('cart-subtotal-page').textContent = `$${total.toFixed(2)}`;
            document.getElementById('cart-total-page').textContent = `$${total.toFixed(2)}`;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cartItems')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cartItems', JSON.stringify(cart));
            renderCart();
            updateCartCount();
        }

        function clearCart() {
            if (confirm('¿Estás seguro de que quieres vaciar el carrito?')) {
                localStorage.removeItem('cartItems');
                renderCart();
                updateCartCount();
            }
        }

        renderCart();
        window.updateCartCount(); // Use value from load-components.js (or ensure it's available)


    </script>

    <script>
        const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        window.dataLayer.push({ event: 'view_cart', currency: 'USD', value: total, items: cart.map(item => ({ item_id: item.id, item_name: item.name, price: item.price, quantity: item.quantity })) });
        window.dataLayer.push({ event: 'page_view', page_title: 'Carrito - Circula', page_location: window.location.href });
    </script>
