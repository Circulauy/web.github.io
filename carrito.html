    <style>
        html {
            scroll-behavior: smooth;
            scrollbar-width: none
        }

        html::-webkit-scrollbar {
            display: none
        }

        .section-padding {
            padding-top: 6rem;
            padding-bottom: 6rem
        }

        .title-style {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: -0.01em
        }

        .nav-link {
            position: relative
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: #79C7C7;
            transition: width .3s ease
        }

        .nav-link:hover::after {
            width: 100%
        }

        #cart-header-row {
            display: none;
            background-color: #f3f4f6;
            border-bottom: 1px solid #d1d5db;
            padding: .75rem 1.5rem;
            font-weight: 700;
            font-size: .875rem;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .cart-item-row {
            display: flex;
            flex-direction: column;
            padding: 1rem 1.5rem;
            gap: .5rem
        }

        .cart-item-row:hover {
            background-color: #f9f9f9
        }

        .cart-item-product {
            display: flex;
            align-items: center;
            gap: .75rem;
            width: 100%
        }

        .cart-item-mobile-data {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            padding-left: 68px;
            padding-top: .5rem
        }

        .cart-item-mobile-data>div {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .875rem
        }

        .cart-item-mobile-data .label {
            color: #6B7280;
            font-weight: 500
        }

        .cart-item-mobile-data .value {
            font-weight: 700;
            color: #333
        }

        /* Estilo para el input de cantidad */
        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            overflow: hidden;
        }
        .qty-control button {
            padding: 0.25rem 0.5rem;
            background-color: #f3f4f6;
            font-weight: 700;
            color: #374151;
            transition: background-color 0.2s;
        }
        .qty-control button:hover {
            background-color: #e5e7eb;
        }
        .qty-control input {
            width: 2.5rem;
            text-align: center;
            border: none;
            outline: none;
            font-weight: 600;
            -moz-appearance: textfield;
        }
        .qty-control input::-webkit-outer-spin-button,
        .qty-control input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .cart-item-desktop-price,
        .cart-item-desktop-qty,
        .cart-item-desktop-total {
            display: none
        }

        @media(min-width:640px) {
            #cart-header-row {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 1rem;
                align-items: center
            }

            #cart-header-row>div:nth-child(1) {
                grid-column: span 2/span 2;
                text-align: left
            }

            #cart-header-row>div:nth-child(2) {
                text-align: center
            }

            #cart-header-row>div:nth-child(3) {
                text-align: center
            }

            #cart-header-row>div:nth-child(4) {
                text-align: right
            }

            .cart-item-row {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 1rem;
                align-items: center
            }

            .cart-item-product {
                grid-column: span 2/span 2
            }

            .cart-item-mobile-data {
                display: none
            }

            .cart-item-desktop-price,
            .cart-item-desktop-qty,
            .cart-item-desktop-total {
                display: block
            }

            .cart-item-desktop-price {
                text-align: center;
                color: #4B5563;
                font-weight: 500
            }

            .cart-item-desktop-qty {
                display: flex;
                justify-content: center
            }

            .cart-item-desktop-total {
                text-align: right;
                font-weight: 700;
                font-size: 1.125rem;
                color: #79C7C7
            }
        }
    </style>
    <link rel="stylesheet" href="css/custom.css">
</head>

<body class="font-sans bg-bg-light text-text-dark">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TH8WM8KW" height="0" width="0"

    <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-200/50">

    <main>
        <section class="bg-bg-light section-padding pt-32 pb-20">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div
                    class="flex justify-between items-center text-center mb-10 border-b border-rp-gray-soft pb-6 overflow-x-auto">
                    <div class="flex flex-col items-center min-w-[80px]">
                        <span
                            class="w-10 h-10 rounded-full bg-rp-teal text-white flex items-center justify-center font-bold text-lg shadow-md mb-2">1</span>
                        <span class="font-bold text-text-dark text-xs md:text-sm">CARRITO</span>
                    </div>
                    <div class="flex-1 h-1 bg-rp-teal/50 mx-2 rounded"></div>
                    <div class="flex flex-col items-center min-w-[80px] opacity-60">
                        <span
                            class="w-10 h-10 rounded-full border-2 border-gray-300 text-gray-500 flex items-center justify-center font-bold text-lg mb-2">2</span>
                        <span class="font-bold text-gray-500 text-xs md:text-sm">DATOS</span>
                    </div>
                    <div class="flex-1 h-1 bg-gray-200 mx-2 rounded"></div>
                    <div class="flex flex-col items-center min-w-[80px] opacity-60">
                        <span
                            class="w-10 h-10 rounded-full border-2 border-gray-300 text-gray-500 flex items-center justify-center font-bold text-lg mb-2">3</span>
                        <span class="font-bold text-gray-500 text-xs md:text-sm">ESTADO</span>
                    </div>
                </div>

                <div class="flex flex-col lg:flex-row gap-8 items-start">
                    <div class="w-full lg:w-3/5">
                        <div class="bg-white rounded-xl shadow-lg border border-rp-gray-soft overflow-hidden">
                            <div id="cart-header-row">
                                <div class="sm:col-span-2 text-left pl-2">PRODUCTO</div>
                                <div class="text-center">PRECIO</div>
                                <div class="text-center">CANT.</div>
                                <div class="text-right pr-2">TOTAL</div>
                            </div>
                            <div id="cart-items-list-page" class="divide-y divide-rp-gray-soft min-h-[100px] bg-white">
                            </div>
                            <div class="p-6 bg-gray-50 border-t border-rp-gray-soft">
                                <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div class="w-full sm:w-1/2">
                                        <input type="text" id="discount-code-input" placeholder="Código de descuento"
                                            class="w-full px-4 py-3 border border-rp-border-default rounded-lg outline-none bg-white focus:ring-2 focus:ring-rp-teal transition uppercase">
                                        <p id="discount-message" class="text-xs mt-1 hidden"></p>
                                    </div>
                                    <div class="flex gap-4 w-full sm:w-auto justify-end">
                                        <button type="button" id="apply-discount-btn" onclick="applyDiscountCode()"

                                        <button id="clear-cart-button" onclick="clearCart()"
                                            class="text-red-500 font-bold hover:text-red-700 text-sm transition py-3">VACIAR</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="w-full lg:w-2/5 sticky top-24">
                        <div class="bg-white p-6 md:p-8 rounded-xl shadow-xl border-t-4 border-rp-teal">
                            <h2 class="text-2xl font-bold mb-6 text-text-dark title-style border-b pb-4">RESUMEN</h2>
                            <div class="space-y-4 mb-6 text-text-dark/80">
                                <div class="flex justify-between items-center">
                                    <span>Subtotal</span>
                                    <span id="cart-subtotal-page" class="font-bold text-lg">$0.00</span>
                                </div>
                                <div id="discount-row" class="flex justify-between items-center text-green-600 font-semibold hidden">
                                    <span>Descuento (<span id="discount-percent-val">0</span>%)</span>
                                    <span id="cart-discount-page">-$0.00</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span>Envío</span>
                                    <span
                                        class="text-rp-teal text-sm font-semibold cursor-pointer hover:underline">Calculado
                                        al final</span>
                                </div>
                            </div>
                            <div
                                class="flex justify-between items-center font-bold text-2xl mb-8 border-t border-rp-gray-soft pt-6">
                                <span class="text-text-dark">TOTAL</span>
                                <span id="cart-total-page" class="text-rp-teal-dark font-bold">$0.00</span>
                            </div>
                            <button onclick="window.location.href='datos.html'"
                                class="w-full bg-text-dark text-white font-bold py-4 px-6 rounded-lg hover:bg-rp-teal transition mb-4 shadow-lg text-lg tracking-wide hover:-translate-y-1 cursor-pointer">
                                FINALIZAR COMPRA
                            </button>
                            <button onclick="window.location.href='tienda.html'"
                                class="w-full bg-transparent border-2 border-rp-gray-soft text-gray-500 font-bold py-3 px-6 rounded-lg hover:border-text-dark hover:text-text-dark transition text-center">
                                Seguir Comprando
                            </button>
                        </div>
                        <div class="mt-6 text-center opacity-60">
                            <p class="text-xs text-gray-400 flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />

        </footer>

    <script src="js/load-components.js?v=1.0.1"></script>
    <script>
        // Removed redundant updateCartCount and Year logic as they are now in load-components.js

        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
            const container = document.getElementById('cart-items-list-page');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-gray-500"><p class="text-lg">Tu carrito está vacío</p><a href="tienda.html" class="inline-block mt-4 text-rp-teal hover:underline">Ir a la tienda</a></div>';
                updateTotals(0);
                return;
            }
            
            container.innerHTML = '';
            
            cart.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'cart-item-row';
                
                // Generamos ID de producto si no existe (fallback al nombre slugificado)
                const productId = item.id || item.name.toLowerCase().replace(/\s+/g, '-');
                
                // HTML reutilizable para el control de cantidad
                const qtyControlHTML = `
                    <div class="qty-control">
                        <button onclick="updateItemQty('${productId}', -1)" type="button">-</button>
                        <input type="number" value="${item.quantity}" min="1" onchange="setItemQty('${productId}', this.value)">
                        <button onclick="updateItemQty('${productId}', 1)" type="button">+</button>
                    </div>
                `;

                row.innerHTML = `
                    <div class="cart-item-product">
                        <a href="detalle.html?product=${productId}" class="flex items-center gap-3 w-full hover:opacity-75 transition group">
                            <img src="${item.imageUrl}" alt="${window.escapeHTML ? window.escapeHTML(item.name) : item.name}" class="w-14 h-14 object-cover rounded border border-rp-gray-soft group-hover:border-rp-teal transition">
                            <div>
                                <h4 class="font-bold text-text-dark group-hover:text-rp-teal transition">${window.escapeHTML ? window.escapeHTML(item.name) : item.name}</h4>
                                <div onclick="event.preventDefault(); event.stopPropagation(); removeItem('${productId}')" class="text-red-500 text-xs hover:underline mt-1 cursor-pointer w-fit">Eliminar</div>
                            </div>
                        </a>
                    </div>
                    
                    <div class="cart-item-mobile-data">
                        <div><span class="label">Precio:</span><span class="value">$${item.price}</span></div>
                        <div>
                            <span class="label">Cantidad:</span>
                            ${qtyControlHTML}
                        </div>
                        <div><span class="label">Total:</span><span class="value text-rp-teal">$${(item.price * item.quantity).toFixed(2)}</span></div>
                    </div>
                    
                    <div class="cart-item-desktop-price">$${item.price}</div>
                    <div class="cart-item-desktop-qty">
                        ${qtyControlHTML}
                    </div>
                    <div class="cart-item-desktop-total">$${(item.price * item.quantity).toFixed(2)}</div>
                `;
                container.appendChild(row);
            });
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            updateTotals(total);
        }

        let appliedDiscountCode = localStorage.getItem('appliedDiscountCode') || null;
        let appliedDiscountPercent = parseFloat(localStorage.getItem('appliedDiscountPercent')) || 0;

        function updateTotals(subtotal) {
            document.getElementById('cart-subtotal-page').textContent = `$${subtotal.toFixed(2)}`;
            
            let discountAmount = 0;
            const discountRow = document.getElementById('discount-row');
            const discountEl = document.getElementById('cart-discount-page');
            const discountPercentVal = document.getElementById('discount-percent-val');
            
            if (appliedDiscountPercent > 0) {
                discountAmount = subtotal * (appliedDiscountPercent / 100);
                if (discountEl) discountEl.textContent = `-$${discountAmount.toFixed(2)}`;
                if (discountPercentVal) discountPercentVal.textContent = appliedDiscountPercent;
                if (discountRow) discountRow.classList.remove('hidden');
            } else {
                if (discountRow) discountRow.classList.add('hidden');
            }

            const total = subtotal - discountAmount;
            document.getElementById('cart-total-page').textContent = `$${total.toFixed(2)}`;
        }

        async function applyDiscountCode() {
            const input = document.getElementById('discount-code-input');
            const btn = document.getElementById('apply-discount-btn');
            const msg = document.getElementById('discount-message');
            
            if (!input || !btn || !msg) return;

            const code = input.value.trim();
            if (!code) {
                alert("Por favor ingresá un código de descuento.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Verificando...";
            msg.classList.add('hidden');

            try {
                // Detectar entorno local
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
                
                let data;
                if (isLocal) {
                    // Simulación local de cupones
                    await new Promise(resolve => setTimeout(resolve, 800));
                    if (code.toUpperCase().startsWith('MOCK') || code.toUpperCase() === 'TEST10') {
                        data = { valid: true, code: code.toUpperCase(), discount_percent: 10 };
                    } else {
                        data = { valid: false, error: "El cupón no existe en modo local. Prueba con 'MOCK10' o 'TEST10'." };
                    }
                } else {
                    const response = await fetch('/.netlify/functions/validate-discount', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });
                    data = await response.json();
                }

                if (data.valid) {
                    appliedDiscountCode = data.code;
                    appliedDiscountPercent = data.discount_percent;
                    localStorage.setItem('appliedDiscountCode', appliedDiscountCode);
                    localStorage.setItem('appliedDiscountPercent', appliedDiscountPercent);

                    msg.textContent = `¡Cupón aplicado! Descuento del ${appliedDiscountPercent}%`;
                    msg.className = "text-xs mt-1 text-green-600 font-semibold block";
                    
                    input.disabled = true;
                    btn.disabled = false;
                    btn.textContent = "Quitar";
                    btn.onclick = removeDiscountCode;
                    
                    // Re-renderizar
                    renderCart();
                } else {
                    msg.textContent = data.error || "Cupón inválido o expirado.";
                    msg.className = "text-xs mt-1 text-red-500 font-semibold block";
                    btn.disabled = false;
                    btn.textContent = "APLICAR";
                }
            } catch (err) {
                console.error("Error al validar cupón:", err);
                msg.textContent = "Error al validar el cupón. Inténtalo de nuevo.";
                msg.className = "text-xs mt-1 text-red-500 font-semibold block";
                btn.disabled = false;
                btn.textContent = "APLICAR";
            }
        }

        function removeDiscountCode() {
            const input = document.getElementById('discount-code-input');
            const btn = document.getElementById('apply-discount-btn');
            const msg = document.getElementById('discount-message');

            appliedDiscountCode = null;
            appliedDiscountPercent = 0;
            localStorage.removeItem('appliedDiscountCode');
            localStorage.removeItem('appliedDiscountPercent');

            if (input) {
                input.value = "";
                input.disabled = false;
            }
            if (btn) {
                btn.textContent = "APLICAR";
                btn.onclick = applyDiscountCode;
            }
            if (msg) {
                msg.classList.add('hidden');
            }

            // Re-renderizar
            renderCart();
        }

        // Inicializar estado del cupón al cargar
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('discount-code-input');
            const btn = document.getElementById('apply-discount-btn');
            const msg = document.getElementById('discount-message');
            if (appliedDiscountCode && input && btn && msg) {
                input.value = appliedDiscountCode;
                input.disabled = true;
                btn.textContent = "Quitar";
                btn.onclick = removeDiscountCode;
                msg.textContent = `¡Cupón aplicado! Descuento del ${appliedDiscountPercent}%`;
                msg.className = "text-xs mt-1 text-green-600 font-semibold block";
            }
        });

        // Nueva función: Cambiar cantidad con botones (+/-)
        function updateItemQty(id, change) {
            let cart = JSON.parse(localStorage.getItem('cartItems')) || [];
            let item = cart.find(i => i.id === id);
            if (item) {
                let newQty = parseInt(item.quantity) + change;
                if (isNaN(newQty) || newQty < 1) newQty = 1; // Mínimo 1
                item.quantity = newQty;
                localStorage.setItem('cartItems', JSON.stringify(cart));
                
                // Actualizar todo
                renderCart();
                window.updateCartCount(); // Sincroniza el header
            }
        }

        // Nueva función: Cambiar cantidad escribiendo en el input
        function setItemQty(id, value) {
            let cart = JSON.parse(localStorage.getItem('cartItems')) || [];
            let newQty = parseInt(value);
            
            if (isNaN(newQty) || newQty < 1) newQty = 1; // Validación
            
            let item = cart.find(i => i.id === id);
            if (item) {
                item.quantity = newQty;
                localStorage.setItem('cartItems', JSON.stringify(cart));
                
                renderCart();
                window.updateCartCount();
            }
        }

        function removeItem(id) {
            let cart = JSON.parse(localStorage.getItem('cartItems')) || [];
            const index = cart.findIndex(i => i.id === id);
            if (index > -1) cart.splice(index, 1);
            localStorage.setItem('cartItems', JSON.stringify(cart));
            renderCart();
            window.updateCartCount();
        }

        function clearCart() {
            if (confirm('¿Estás seguro de que querés vaciar el carrito?')) {
                localStorage.removeItem('cartItems');
                localStorage.removeItem('appliedDiscountCode');
                localStorage.removeItem('appliedDiscountPercent');
                appliedDiscountCode = null;
                appliedDiscountPercent = 0;
                
                const input = document.getElementById('discount-code-input');
                const btn = document.getElementById('apply-discount-btn');
                const msg = document.getElementById('discount-message');
                if (input) {
                    input.value = "";
                    input.disabled = false;
                }
                if (btn) {
                    btn.textContent = "APLICAR";
                    btn.onclick = applyDiscountCode;
                }
                if (msg) msg.classList.add('hidden');
                
                renderCart();
                window.updateCartCount();
            }
        }

        renderCart();
        window.updateCartCount(); // Use value from load-components.js (or ensure it's available)
    </script>

    <script>
        const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        window.dataLayer.push({ event: 'view_cart', currency: 'USD', value: total, items: cart.map(item => ({ item_id: item.id || item.name.toLowerCase().replace(/\s+/g, '-'), item_name: item.name, price: item.price, quantity: item.quantity })) });
        window.dataLayer.push({ event: 'page_view', page_title: 'Carrito - Circula', page_location: window.location.href });
    </script>
