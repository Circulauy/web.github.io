<!DOCTYPE html>
<html lang="es" class="lenis lenis-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circula - WebGL Experience</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Patua+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'bg-light': '#fafafa', 'text-dark': '#333333', 'rp-teal': '#79C7C7', 'rp-mint': '#A3E6BA', 'rp-blue-light': '#e0f7f7', 'rp-dark-blue': '#2c5e5e' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Patua One', 'cursive'], brand: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        /* CSS MÍNIMO: El HTML es solo un fantasma para el layout */
        body { margin: 0; padding: 0; background-color: #050505; overflow-x: hidden; }
        
        /* El Canvas vive detrás de todo */
        #webgl-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
        }

        /* --- LAYOUT GHOST (MÓVIL) --- */
        @media (max-width: 1023px) {
            #gallery-grid { display: block; padding: 0; }
            
            .masonry-item {
                /* Usamos Sticky CSS para calcular la posición, WebGL copiará esto */
                position: sticky; top: 0;
                height: 100vh; width: 100%;
                z-index: 1;
                /* Las imágenes HTML son invisibles, solo sirven para que Google las vea y para calcular el layout */
                opacity: 0; 
                pointer-events: none; /* Los clicks los manejaremos manualmente o via overlay */
            }
            
            /* Overlay de texto visible sobre el canvas */
            .text-overlay {
                position: absolute; bottom: 0; left: 0; width: 100%;
                padding: 2rem; padding-bottom: 6rem;
                background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
                opacity: 1 !important; /* El texto SÍ se ve en HTML */
                pointer-events: auto;
                z-index: 10;
            }
        }

        /* --- LAYOUT PC (GRID) --- */
        @media (min-width: 1024px) {
            #gallery-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.5rem; padding-bottom: 5rem; }
            .masonry-item { position: relative; height: 60vh; opacity: 0; } /* Invisible, WebGL renderiza */
            .pos-0 { grid-column: 1 / span 5; } .pos-1 { grid-column: 4 / span 4; margin-top: 3rem; }
            .pos-2 { grid-column: 9 / span 4; margin-top: -4rem; } .pos-3 { grid-column: 2 / span 6; margin-top: -2rem; margin-left: 2rem; }
            .pos-4 { grid-column: 10 / span 3; }
            /* En PC mostramos el texto flotante */
            .text-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 2rem; color: white; opacity: 1 !important; }
        }

        #loader-overlay { position: fixed; inset: 0; z-index: 99999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; color: white; }
        
        /* Interfaz UI */
        header { pointer-events: auto; }
    </style>
</head>
<body class="font-sans text-text-dark antialiased">

    <canvas id="webgl-canvas"></canvas>

    <div id="loader-overlay">
        <i class="fas fa-circle-notch fa-spin text-4xl text-rp-teal mb-4"></i>
        <p class="font-brand tracking-widest text-xs uppercase">Iniciando Motor 3D...</p>
    </div>

    <header class="fixed top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200/50 w-full">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <img src="images/logo.png" alt="Logo" class="h-8 object-contain">
            <nav class="max-md:hidden space-x-8 flex">
                <a href="#" class="font-brand text-sm hover:text-rp-teal transition">Galería</a>
            </nav>
        </div>
    </header>

    <main class="relative z-10">
        <section class="px-4 text-center py-32 bg-white/0">
            <h1 class="text-5xl md:text-8xl font-bold title-style text-white mb-6 mix-blend-difference">IMPACTO VISUAL</h1>
            <div class="flex flex-wrap justify-center gap-2 mt-8">
                <button class="filter-btn px-6 py-2 rounded-full bg-white text-black font-bold text-xs" data-filter="all">TODO</button>
            </div>
        </section>

        <section class="container mx-auto px-0 relative z-20">
            <div id="gallery-grid"></div>
        </section>
        
        <div class="h-screen"></div> </main>

    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uVelocity;
        uniform vec2 uViewportSizes;
        varying vec2 vUv;
        varying float vElevation;

        void main() {
            vUv = uv;
            vec3 pos = position;

            // EFECTO RESN: Curvatura basada en velocidad y posición Y
            // Cuanto más rápido scrolleas, más se dobla la tarjeta
            float curveStrength = uVelocity * 0.002;
            
            // Deformación parabólica
            pos.z += sin(pos.y * 0.05 + uTime) * 0.0; // Ondulación base (opcional)
            
            // Bending effect (doblar bordes al mover)
            float distFromCenter = uv.y - 0.5;
            pos.z -= pow(distFromCenter, 2.0) * uVelocity * 1.5; 

            vElevation = pos.z;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform sampler2D uTexture;
        uniform float uOpacity;
        uniform float uShadowStrength; // Sombra por stacking
        varying vec2 vUv;
        varying float vElevation;

        void main() {
            vec4 textureColor = texture2D(uTexture, vUv);
            
            // Aplicamos sombra basada en uniform (controlado por JS según posición)
            vec3 finalColor = mix(textureColor.rgb, vec3(0.0), uShadowStrength);
            
            gl_FragColor = vec4(finalColor, uOpacity);
        }
    </script>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4R12u0TEqvWMUK5-Z4n9tWw6gg1Abuyt6hgSB630nZA0UoPv6MGFDPg3sSdw5cOgxa_R3jofB3ECi/pub?output=csv';
        const PLACEHOLDER_IMG = "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop"; 

        // --- SISTEMA WEBGL ---
        class WebGLApp {
            constructor() {
                this.canvas = document.querySelector('#webgl-canvas');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.scroll = 0;
                this.scrollVelocity = 0;
                this.meshes = [];
                
                this.initThree();
                this.initLenis();
                this.addEvents();
            }

            initThree() {
                this.scene = new THREE.Scene();
                
                // Cámara ortográfica para mapear 1:1 con píxeles CSS
                // Esto es vital para mezclar HTML y WebGL
                this.camera = new THREE.OrthographicCamera(
                    this.width / -2, this.width / 2, 
                    this.height / 2, this.height / -2, 
                    1, 1000
                );
                this.camera.position.z = 10;

                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: this.canvas, 
                    alpha: true, // Fondo transparente
                    antialias: true 
                });
                this.renderer.setSize(this.width, this.height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance
            }

            initLenis() {
                this.lenis = new Lenis({ lerp: 0.1, smooth: true });
                
                this.lenis.on('scroll', ({ scroll, velocity }) => {
                    this.scroll = scroll;
                    this.scrollVelocity = velocity;
                    this.syncScroll();
                });
            }

            // CREAR MALLAS 3D BASADAS EN EL DOM
            createMeshItem(element, imgUrl) {
                const rect = element.getBoundingClientRect();
                
                // Geometría con segmentos para permitir curvatura
                const geometry = new THREE.PlaneGeometry(1, 1, 32, 32); 
                
                // Carga de textura
                const textureLoader = new THREE.TextureLoader();
                textureLoader.crossOrigin = "Anonymous"; // Intento de saltar CORS
                
                const texture = textureLoader.load(imgUrl);
                
                // Material Shader Personalizado
                const material = new THREE.ShaderMaterial({
                    vertexShader: document.getElementById('vertexShader').textContent,
                    fragmentShader: document.getElementById('fragmentShader').textContent,
                    uniforms: {
                        uTexture: { value: texture },
                        uVelocity: { value: 0 },
                        uOpacity: { value: 1 },
                        uShadowStrength: { value: 0 }, // 0 = luz, 1 = negro
                        uTime: { value: 0 }
                    },
                    transparent: true
                });

                const mesh = new THREE.Mesh(geometry, material);
                this.scene.add(mesh);

                return { mesh, element, rect };
            }

            syncScroll() {
                // En el loop de renderizado actualizamos las posiciones
            }

            updateMeshes() {
                this.meshes.forEach((item, index) => {
                    // Obtenemos la posición actual del elemento DOM "fantasma"
                    // Como el DOM usa position: sticky, el getBoundingClientRect refleja eso.
                    const rect = item.element.getBoundingClientRect();
                    
                    // Actualizamos tamaño (por si cambia)
                    const width = rect.width;
                    const height = rect.height;

                    // Escala de la malla 3D para coincidir con el DOM
                    item.mesh.scale.set(width, height, 1);

                    // Posición WebGL (Sistema de coordenadas: Centro 0,0)
                    // Convertimos coordenadas de pantalla (Top Left 0,0) a WebGL
                    item.mesh.position.x = rect.left - this.width / 2 + width / 2;
                    item.mesh.position.y = -rect.top + this.height / 2 - height / 2;

                    // --- LÓGICA RESN (SHADOW STACKING) ---
                    // Si el elemento está en top: 0 (sticky), calculamos cuánto se ha solapado
                    // para oscurecerlo.
                    
                    let shadow = 0;
                    
                    // Si no es el último elemento
                    if (index < this.meshes.length - 1) {
                        const nextRect = this.meshes[index + 1].element.getBoundingClientRect();
                        
                        // Si el siguiente elemento está subiendo y solapando a este
                        if (nextRect.top < window.innerHeight) {
                            // Calculamos porcentaje de solapamiento
                            const overlap = 1.0 - (nextRect.top / window.innerHeight);
                            // Aplicamos sombra progresiva
                            shadow = Math.max(0, overlap * 0.8); 
                        }
                    }

                    // Pasar valores al Shader
                    item.mesh.material.uniforms.uShadowStrength.value = shadow;
                    item.mesh.material.uniforms.uVelocity.value = this.scrollVelocity * 0.5; // Curvatura
                });
            }

            render() {
                this.lenis.raf(performance.now());
                this.updateMeshes();
                this.renderer.render(this.scene, this.camera);
                requestAnimationFrame(this.render.bind(this));
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.camera.left = this.width / -2;
                this.camera.right = this.width / 2;
                this.camera.top = this.height / 2;
                this.camera.bottom = this.height / -2;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(this.width, this.height);
            }

            addEvents() {
                window.addEventListener('resize', this.resize.bind(this));
            }
        }

        // --- LÓGICA DE DATOS Y DOM ---
        function fixLink(url) {
            if (!url) return PLACEHOLDER_IMG;
            let cleanUrl = url.replace(/\\/g, '/').trim();
            // Truco para Google Drive en WebGL: Usar proxy o thumbnail directo grande
            if (cleanUrl.includes('drive.google.com')) {
                const idMatch = cleanUrl.match(/[-\w]{25,}/); 
                if (idMatch) return `https://lh3.googleusercontent.com/d/${idMatch[0]}=s1000?authuser=0`; // Enlace directo a imagen
            }
            return cleanUrl;
        }

        function csvToJSON(csvText) {
            const lines = csvText.split("\n");
            const headers = lines[0].split(",").map(h => h.replace(/^"|"$/g, '').trim().toLowerCase());
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const obj = {};
                const currentline = lines[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                if(currentline) { headers.forEach((header, j) => { obj[header] = currentline[j] ? currentline[j].replace(/^"|"$/g, '').trim() : ''; }); result.push(obj); }
            } return result;
        }

        async function initApp() {
            try {
                const response = await fetch(SHEET_URL + '&t=' + Date.now());
                const data = await response.text();
                const items = csvToJSON(data);
                const grid = document.getElementById('gallery-grid');
                
                // Instanciamos WebGL
                const app = new WebGLApp();

                items.forEach((item, index) => {
                    if(!item.img && !item.imagen) return;
                    
                    const imgUrl = fixLink(item.img || item.imagen);
                    
                    // CREAMOS DOM GHOST
                    const el = document.createElement('div');
                    el.className = `masonry-item pos-${index % 5}`;
                    // En HTML ponemos el texto (SEO friendly)
                    el.innerHTML = `
                        <div class="text-overlay">
                            <p class="text-rp-mint text-[10px] font-bold uppercase mb-2">${item.category || 'General'}</p>
                            <h3 class="text-white font-heading text-4xl shadow-black drop-shadow-lg">${item.title || 'Proyecto'}</h3>
                        </div>
                    `;
                    grid.appendChild(el);

                    // AÑADIMOS AL MUNDO 3D
                    // Esperamos un tick para que el DOM tenga dimensiones
                    setTimeout(() => {
                        const meshData = app.createMeshItem(el, imgUrl);
                        app.meshes.push(meshData);
                    }, 100);
                });

                // Iniciamos loop
                app.render();
                
                // Ocultar loader
                setTimeout(() => { document.getElementById('loader-overlay').style.opacity = 0; }, 1000);
                setTimeout(() => { document.getElementById('loader-overlay').style.display = 'none'; }, 1500);

            } catch (e) { console.error("Error crítico:", e); }
        }

        window.addEventListener('load', initApp);

    </script>
</body>
</html>
