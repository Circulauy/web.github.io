<!DOCTYPE html>
<html lang="es" class="lenis lenis-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circula - Galería</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Patua+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-light': '#fafafa', 'text-dark': '#333333', 'rp-teal': '#79C7C7',
                        'rp-mint': '#A3E6BA', 'rp-blue-light': '#e0f7f7', 'rp-dark-blue': '#2c5e5e',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'], heading: ['Patua One', 'cursive'], brand: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* --- LENIS SCROLL --- */
        html.lenis, html.lenis body { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }
        
        body { background-color: #f8fafc; overflow-x: hidden; }
        .title-style { font-family: 'Patua One', cursive; letter-spacing: -0.02em; }
        #background-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at top left, #ffffff, #f1f5f9); }
        .plastic-particle { position: absolute; border-radius: 50%; background: linear-gradient(135deg, rgba(121, 199, 199, 0.3), rgba(163, 230, 186, 0.1)); backdrop-filter: blur(1px); }

        /* ========================================= */
        /* === CORRECCIÓN RESPONSIVE (CRUCIAL) === */
        /* ========================================= */

        /* --- VISTA MÓVIL (Por defecto) --- */
        #gallery-grid {
            display: flex;
            flex-direction: column;
            gap: 2rem; /* Espacio entre fotos en móvil */
            padding-bottom: 5rem;
        }

        .masonry-item {
            width: 100%;
            /* EN MÓVIL: Altura fija para que sea inmersivo (60% de la pantalla) */
            height: 60vh; 
            opacity: 0; /* Para animación GSAP */
            transform: translateY(50px);
        }
        
        /* Reset de márgenes para móvil */
        .pos-0, .pos-1, .pos-2, .pos-3, .pos-4 { margin: 0 !important; }

        /* --- VISTA ESCRITORIO (Solo pantallas grandes) --- */
        @media (min-width: 1024px) {
            #gallery-grid {
                display: grid;
                grid-template-columns: repeat(12, 1fr);
                grid-auto-rows: minmax(100px, auto); 
                gap: 1.5rem;
                display: grid !important; /* Forza grid en PC */
            }

            .masonry-item {
                height: auto; /* En PC la altura es variable según contenido */
            }

            /* Patrones de "Broken Grid" SOLO para PC */
            .pos-0 { grid-column: 1 / span 5; grid-row: span 4; z-index: 1; }
            .pos-1 { grid-column: 4 / span 4; grid-row: span 3; z-index: 2; margin-top: 3rem !important; }
            .pos-2 { grid-column: 9 / span 4; grid-row: span 5; z-index: 1; margin-top: -4rem !important; }
            .pos-3 { grid-column: 2 / span 6; grid-row: span 3; z-index: 3; margin-top: -2rem !important; margin-left: 2rem; }
            .pos-4 { grid-column: 10 / span 3; grid-row: span 3; z-index: 2; }
        }

        /* --- ESTILOS COMUNES --- */
        .img-wrapper {
            position: relative; overflow: hidden; border-radius: 1.5rem;
            width: 100%; height: 100%; /* Llena el contenedor padre */
            background-color: #e2e8f0;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1);
        }

        .parallax-img {
            height: 140%; width: 100%; object-fit: cover;
            position: absolute; top: -20%; left: 0; will-change: transform;
        }

        .item-overlay { background: linear-gradient(to top, rgba(30, 60, 60, 0.9) 0%, rgba(0,0,0,0) 70%); }
        
        #whatsapp-widget { position: fixed; bottom: 20px; right: 20px; z-index: 99999; }
        #whatsapp-icon { width: 60px; height: 60px; font-size: 30px; z-index: 10001; }
        #whatsapp-chat-box.hidden { display: none !important; }
    </style>
</head>
<body class="font-sans text-text-dark antialiased">

    <div id="background-canvas"></div>

    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b border-gray-100 transition-all duration-300">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group hover:opacity-80 transition duration-200">
                <img src="images/logo.png" alt="Logo Circula" class="h-10 object-contain">
            </a>
            <nav class="flex max-md:hidden space-x-8 items-center">
                <a href="index.html" class="font-brand text-sm font-semibold text-text-dark hover:text-rp-teal transition">Inicio</a>
                <a href="#" class="font-brand text-sm font-bold text-rp-teal">Galería</a>
                <a href="tienda.html" class="font-brand text-sm font-semibold text-text-dark hover:text-rp-teal transition">Tienda</a>
                <a href="contacto.html" class="font-brand text-sm font-semibold text-text-dark hover:text-rp-teal transition">Contacto</a>
            </nav>
            <div class="flex items-center space-x-4">
                <button class="md:hidden text-2xl text-text-dark"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main class="min-h-screen">
        <section class="pt-32 pb-12 px-4 text-center relative z-10">
            <span class="text-rp-teal font-extrabold tracking-[0.4em] uppercase mb-4 block text-xs opacity-0" id="gallery-subtitle">Galería</span>
            <h1 class="text-5xl md:text-8xl font-bold title-style text-text-dark mb-6 opacity-0 leading-none" id="gallery-title">
                IMPACTO <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-rp-teal to-rp-dark-blue">VISUAL</span>
            </h1>
            <p class="text-lg text-gray-500 max-w-xl mx-auto mb-10 opacity-0 font-light" id="gallery-desc">
                Desliza para ver la transformación de materiales.
            </p>

            <div class="flex flex-wrap justify-center gap-2 opacity-0" id="gallery-filters">
                <button class="filter-btn active px-6 py-2 rounded-full bg-text-dark text-white font-bold text-xs tracking-wide" data-filter="all">TODO</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-white border border-gray-200 text-gray-500 font-bold text-xs tracking-wide" data-filter="talleres">TALLERES</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-white border border-gray-200 text-gray-500 font-bold text-xs tracking-wide" data-filter="productos">PRODUCTOS</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-white border border-gray-200 text-gray-500 font-bold text-xs tracking-wide" data-filter="impacto">IMPACTO</button>
            </div>
        </section>

        <section class="container mx-auto px-4 sm:px-6 lg:px-16 relative z-20">
            <div id="gallery-grid">
                <div class="h-64 flex items-center justify-center text-gray-400 font-light w-full">
                    <i class="fas fa-circle-notch fa-spin mr-3 text-rp-teal"></i> Cargando...
                </div>
            </div>
        </section>
    </main>

    <div id="lightbox" class="fixed inset-0 z-[100] hidden opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-rp-dark-blue/95 backdrop-blur-xl" onclick="closeLightbox()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
            <div class="relative bg-white rounded-[1.5rem] overflow-hidden shadow-2xl w-full max-w-5xl max-h-[80vh] flex flex-col md:flex-row pointer-events-auto transform scale-95" id="lightbox-content">
                <div class="w-full md:w-3/5 h-[40vh] md:h-auto bg-gray-100 relative overflow-hidden">
                    <img id="lb-img" src="" alt="" class="w-full h-full object-cover">
                </div>
                <div class="w-full md:w-2/5 p-8 flex flex-col justify-center bg-white relative">
                    <button onclick="closeLightbox()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 transition text-text-dark">
                        <i class="fas fa-times"></i>
                    </button>
                    <span id="lb-category" class="text-rp-teal font-extrabold uppercase tracking-widest text-xs mb-2 block">Categoría</span>
                    <h3 id="lb-title" class="text-2xl md:text-3xl font-heading text-text-dark mb-4 leading-none">Título</h3>
                    <p id="lb-desc" class="text-gray-500 text-sm mb-6 leading-relaxed font-light">Descripción...</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-text-dark text-white py-12 border-t border-gray-800 relative z-30">
        <div class="container mx-auto px-4 text-center">
            <p class="text-2xl font-bold text-rp-teal title-style mb-4">Circula</p>
            <p class="text-sm text-gray-500 font-light">&copy; 2025 Circula.</p>
        </div>
    </footer>

    <div id="whatsapp-widget">
        <button id="whatsapp-icon" onclick="toggleChat()" class="bg-[#25D366] text-white rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition"><i class="fab fa-whatsapp"></i></button>
        <div id="whatsapp-chat-box" class="hidden w-[300px] h-[400px] bg-white rounded-[20px] absolute bottom-[75px] right-0 flex flex-col overflow-hidden z-[10000] shadow-2xl">
            <div class="bg-[#075E54] text-white p-4 flex items-center"><span class="font-bold">Circula</span></div>
            <div class="bg-[#ECE5DD] flex-grow p-4 overflow-y-auto"><div class="bg-white p-3 rounded-lg shadow-sm text-sm inline-block">¡Hola! 👋 Escríbenos.</div></div>
            <div class="p-3 bg-[#f0f0f0] flex items-center"><input type="text" id="mensaje-usuario" placeholder="Mensaje..." class="flex-grow p-2 rounded-full border-none outline-none text-sm mr-2"><button onclick="enviarWhatsApp()" class="text-[#075E54]"><i class="fas fa-paper-plane"></i></button></div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4R12u0TEqvWMUK5-Z4n9tWw6gg1Abuyt6hgSB630nZA0UoPv6MGFDPg3sSdw5cOgxa_R3jofB3ECi/pub?output=csv';
        const PLACEHOLDER_IMG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect fill='%23f1f5f9' width='400' height='300'/%3E%3C/svg%3E";
        let galleryItems = [];
        const gridContainer = document.getElementById('gallery-grid');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Init Lenis & GSAP
        const lenis = new Lenis({ duration: 1.5, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smooth: true, mouseMultiplier: 0.8 });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);
        gsap.registerPlugin(ScrollTrigger);

        function fixLink(url) {
            if (!url) return PLACEHOLDER_IMG;
            let cleanUrl = url.replace(/\\/g, '/').trim();
            if (cleanUrl.includes('drive.google.com') && (cleanUrl.includes('view') || cleanUrl.includes('open'))) {
                const idMatch = cleanUrl.match(/[-\w]{25,}/); 
                if (idMatch) return `https://drive.google.com/thumbnail?id=${idMatch[0]}&sz=w1000`;
            }
            return cleanUrl;
        }

        function csvToJSON(csvText) {
            const lines = csvText.split("\n");
            const headers = lines[0].split(",").map(h => h.replace(/^"|"$/g, '').trim().toLowerCase());
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const obj = {};
                const currentline = lines[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                if(currentline) { headers.forEach((header, j) => { obj[header] = currentline[j] ? currentline[j].replace(/^"|"$/g, '').trim() : ''; }); result.push(obj); }
            } return result;
        }

        function renderGallery(filter = 'all') {
            ScrollTrigger.getAll().forEach(t => t.kill());
            gridContainer.innerHTML = '';
            if(galleryItems.length === 0) { gridContainer.innerHTML = '<div class="w-full text-center py-20 text-gray-400">Cargando...</div>'; return; }

            const itemsToShow = filter === 'all' ? galleryItems : galleryItems.filter(item => item.category && item.category.toLowerCase() === filter.toLowerCase());

            itemsToShow.forEach((item, index) => {
                const imageUrl = fixLink(item.img || item.imagen);
                const titulo = item.title || "Proyecto";
                const categoria = item.category || "General";
                
                // --- CLASES RESPONSIVE ---
                // "pos-X" solo aplica en escritorio gracias al CSS media query
                const positionClass = `pos-${index % 5}`;

                const el = document.createElement('div');
                el.className = `masonry-item group cursor-pointer ${positionClass}`;
                el.onclick = () => openLightbox({...item, img: imageUrl, title: titulo, category: categoria});

                el.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${imageUrl}" alt="${titulo}" class="parallax-img" referrerpolicy="no-referrer" onerror="this.src='${PLACEHOLDER_IMG}'">
                        <div class="item-overlay absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-6">
                            <span class="text-rp-mint text-[10px] font-bold uppercase tracking-wider mb-2 translate-y-4 group-hover:translate-y-0 transition-transform duration-500">${categoria}</span>
                            <h3 class="text-white font-heading text-2xl lg:text-3xl translate-y-4 group-hover:translate-y-0 transition-transform duration-500 delay-75 leading-none">${titulo}</h3>
                        </div>
                    </div>
                `;
                gridContainer.appendChild(el);

                // Animaciones
                gsap.fromTo(el, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1, ease: "power3.out", scrollTrigger: { trigger: el, start: "top 95%" } });
                
                const img = el.querySelector('.parallax-img');
                const pSpeed = (window.innerWidth < 1024) ? 10 : (index % 2 === 0 ? 25 : 15); // Menos movimiento en móvil
                gsap.fromTo(img, { yPercent: -pSpeed }, { yPercent: pSpeed, ease: "none", scrollTrigger: { trigger: el, start: "top bottom", end: "bottom top", scrub: true } });
            });
            ScrollTrigger.refresh(); lenis.resize();
        }

        // Filtros y Lightbox
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => { b.classList.remove('bg-text-dark', 'text-white'); b.classList.add('bg-white', 'text-gray-500', 'border', 'border-gray-200'); });
                btn.classList.remove('bg-white', 'text-gray-500', 'border', 'border-gray-200'); btn.classList.add('bg-text-dark', 'text-white');
                renderGallery(btn.dataset.filter);
            });
        });
        const lightbox = document.getElementById('lightbox'); const lbContent = document.getElementById('lightbox-content');
        function openLightbox(item) {
            document.getElementById('lb-img').src = item.img; document.getElementById('lb-category').innerText = item.category;
            document.getElementById('lb-title').innerText = item.title; document.getElementById('lb-desc').innerText = item.desc || '';
            lightbox.classList.remove('hidden');
            gsap.to(lightbox, { opacity: 1, duration: 0.4 });
            gsap.fromTo(lbContent, { scale: 0.9, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" });
        }
        function closeLightbox() {
            gsap.to(lbContent, { scale: 0.9, opacity: 0, y: 20, duration: 0.3 });
            gsap.to(lightbox, { opacity: 0, duration: 0.3, onComplete: () => lightbox.classList.add('hidden') });
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

        async function initGallerySystem() {
            try {
                const tl = gsap.timeline(); tl.to("#gallery-subtitle", { opacity: 1, y: 0, duration: 0.8 }).to("#gallery-title", { opacity: 1, y: 0, duration: 0.8 }, "-=0.6").to("#gallery-desc", { opacity: 1, y: 0, duration: 0.8 }, "-=0.6").to("#gallery-filters", { opacity: 1, y: 0, duration: 0.8 }, "-=0.6");
                const response = await fetch(SHEET_URL + '&t=' + Date.now());
                const data = await response.text();
                galleryItems = csvToJSON(data);
                renderGallery('all'); 
                
                const container = document.getElementById('background-canvas');
                if(container) { for (let i = 0; i < 15; i++) { const div = document.createElement('div'); div.classList.add('plastic-particle'); const size = gsap.utils.random(30, 100); gsap.set(div, { width: size, height: size, backgroundColor: ['#79C7C7', '#A3E6BA', '#e2e8f0'][Math.floor(Math.random()*3)], opacity: gsap.utils.random(0.05, 0.15), left: gsap.utils.random(0, 100) + '%', top: gsap.utils.random(0, 100) + '%' }); container.appendChild(div); gsap.to(div, { y: gsap.utils.random(-100, 100), rotation: gsap.utils.random(0, 360), duration: gsap.utils.random(25, 45), repeat: -1, yoyo: true, ease: "sine.inOut" }); } }
            } catch (error) { console.error(error); }
        }
        function toggleChat() { document.getElementById('whatsapp-chat-box').classList.toggle('hidden'); }
        function enviarWhatsApp() { const i = document.getElementById('mensaje-usuario'); if(i && i.value.trim()) window.open(`https://wa.me/59899395724?text=${encodeURIComponent(i.value)}`, '_blank'); }
        window.addEventListener('load', initGallerySystem);
    </script>
</body>
</html>
